name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Test-change gate (C-18)
        if: github.event_name == 'pull_request'
        run: |
          c=$(git log --format=%H --grep='^contract(' origin/${{ github.base_ref }}..HEAD | tail -1)
          if [ -z "$c" ]; then echo "notice: no contract commit"; exit 0; fi
          git diff --name-status --exit-code "$c" HEAD -- test/

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test
